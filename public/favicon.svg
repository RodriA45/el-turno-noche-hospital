<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#220508"/>
      <stop offset="85%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#040406"/>
    </radialGradient>

    <!-- Cross Crimson Gradient -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3344"/>
      <stop offset="45%" stop-color="#cc1122"/>
      <stop offset="100%" stop-color="#77050e"/>
    </linearGradient>

    <!-- Surveillance Lens Shading -->
    <radialGradient id="lensGrad" cx="38%" cy="36%" r="60%">
      <stop offset="0%" stop-color="#2a080c"/>
      <stop offset="50%" stop-color="#120406"/>
      <stop offset="100%" stop-color="#030102"/>
    </radialGradient>

    <!-- Pupil Glowing Core -->
    <radialGradient id="recGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ff3b4e"/>
      <stop offset="75%" stop-color="#dc1428"/>
      <stop offset="100%" stop-color="#66000a"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Red Terror Glow Filter -->
    <filter id="terrorGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Atmospheric Container Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGlow)" stroke="#3a0d12" stroke-width="1.5"/>

  <!-- Hospital Cross with Depth Shadow -->
  <g filter="url(#shadow)">
    <!-- Seamless Hospital Cross (Path) -->
    <path d="
      M 24 9
      C 24 7.34 25.34 6 27 6
      L 37 6
      C 38.66 6 40 7.34 40 9
      L 40 24
      L 55 24
      C 56.66 24 58 25.34 58 27
      L 58 37
      C 58 38.66 56.66 40 55 40
      L 40 40
      L 40 55
      C 40 56.66 38.66 58 37 58
      L 27 58
      C 25.34 58 24 56.66 24 55
      L 24 40
      L 9 40
      C 7.34 40 6 38.66 6 37
      L 6 27
      C 6 25.34 7.34 24 9 24
      L 24 24
      Z"
      fill="url(#crossGrad)"
      stroke="#ff6677"
      stroke-width="0.8"
      stroke-opacity="0.4"
    />

    <!-- Distressed Weathering / Seam Cuts on the Cross -->
    <path d="M 24 24 L 27 27 M 40 24 L 37 27 M 24 40 L 27 37 M 40 40 L 37 37" stroke="#440206" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Central Surveillance Camera Lens / Demonic CCTV Eye -->
  <g filter="url(#terrorGlow)">
    <!-- Outer Metal Bezel Ring -->
    <circle cx="32" cy="32" r="14.5" fill="#08080a" stroke="#1f0709" stroke-width="2"/>
    
    <!-- Camera Sensor Aperture Ring -->
    <circle cx="32" cy="32" r="12" fill="url(#lensGrad)" stroke="#550f16" stroke-width="1.2"/>

    <!-- CCTV Reticle / Crosshair Marks -->
    <line x1="32" y1="18" x2="32" y2="21" stroke="#ff2233" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    <line x1="32" y1="43" x2="32" y2="46" stroke="#ff2233" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    <line x1="18" y1="32" x2="21" y2="32" stroke="#ff2233" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    <line x1="43" y1="32" x2="46" y2="32" stroke="#ff2233" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>

    <!-- Inner Lens Ring -->
    <circle cx="32" cy="32" r="7.5" fill="#060102" stroke="#881520" stroke-width="0.8"/>

    <!-- Glowing Red Camera Pupil / Warning REC Core -->
    <circle cx="32" cy="32" r="4.2" fill="url(#recGlow)"/>

    <!-- Specular Lens Glint -->
    <circle cx="30" cy="30" r="1.3" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
